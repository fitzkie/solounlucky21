# Bitcoin Core configuration for Unlucky21 — mainnet
# Deploy to: /etc/unlucky21/bitcoin.conf  (on the NEW mainnet server)
# Generate a strong RPC password: openssl rand -hex 32

# ── Network ───────────────────────────────────────────────────────────────────
# mainnet is the default — no flag needed

# Force IPv4 only (Vultr; check if your instance has IPv6 before removing)
onlynet=ipv4

# ── RPC server ────────────────────────────────────────────────────────────────
server=1
daemon=1
rpcuser=unlucky21rpc
# MUST be replaced before deployment — never commit a real password here
rpcpassword=REPLACE_WITH_STRONG_RANDOM_PASSWORD
rpcallowip=127.0.0.1
rpcport=8332

# ── Pruning ───────────────────────────────────────────────────────────────────
# Keeps only the UTXO set + 1 GB of recent blocks (~15 GB total on disk).
# A mining pool only needs the chain tip + mempool to build block templates —
# historical blocks are not required. Pruning cannot be undone without a
# full re-sync, so commit to this before starting IBD.
prune=1024

# ── Block template / mining ───────────────────────────────────────────────────
# Same headroom as signet — 25 coinbase outputs needs > 4000 default.
coinbasetxnweight=100000

# ── Performance ───────────────────────────────────────────────────────────────
# 8 GB server: reserve ~4 GB for dbcache to speed up IBD and UTXO lookups.
# The remaining 4 GB covers OS, PostgreSQL, datum_gateway, and reward service.
dbcache=4096

# Mainnet mempool can grow large — cap it to protect the 8 GB instance.
maxmempool=300

# ── Indexes ───────────────────────────────────────────────────────────────────
# txindex is not needed for pool operation.
txindex=0

# ── Connections ───────────────────────────────────────────────────────────────
# Lower than default to keep RAM/bandwidth usage predictable on a small server.
maxconnections=20
