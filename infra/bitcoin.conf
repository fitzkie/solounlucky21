# Bitcoin Core configuration for SoloUnlucky21 — signet mode
# Deploy to: /etc/unlucky21/bitcoin.conf
# IMPORTANT: Replace the rpcpassword placeholder with a strong random password
#            before deploying. Generate one with: openssl rand -hex 32

# ── Network ──────────────────────────────────────────────────────────────────
signet=1

# ── RPC server ───────────────────────────────────────────────────────────────
server=1
daemon=1
rpcuser=unlucky21rpc
# MUST be replaced before deployment — never commit a real password here
rpcpassword=REPLACE_WITH_STRONG_RANDOM_PASSWORD
rpcallowip=127.0.0.1
rpcport=18443

# ── Block template / mining ───────────────────────────────────────────────────
# Default coinbasetxnweight is 4000, which is too small for our 25-output
# coinbase (23 value outputs + 2 OP_RETURN outputs for datum_gateway).
# 100000 gives permanent headroom and prevents getblocktemplate failures as
# the payout set grows.
coinbasetxnweight=100000

# ── Performance ───────────────────────────────────────────────────────────────
# Keep the UTXO set in RAM as much as possible for fast getblocktemplate calls.
dbcache=2048

# Limit mempool memory usage on the VPS.
maxmempool=512

# ── Indexes ───────────────────────────────────────────────────────────────────
# txindex is not needed for pool operation; disable it to save disk and RAM.
txindex=0
